# Deploy Earthseed static pages to GitHub Pages
#
# To activate:
# 1. Go to this repository's Settings → Pages.
# 2. Under "Build and deployment", set Source to "GitHub Actions".
# 3. Merge this branch to main. The workflow runs automatically and the site goes live.
#
# Live URLs after deployment:
#   https://coldtie.github.io/Earthseed/
#   https://coldtie.github.io/Earthseed/food/
#   https://coldtie.github.io/Earthseed/seniors/
#   https://coldtie.github.io/Earthseed/volunteers/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/food _site/volunteers _site/seniors

          # Root landing page
          cp index.html _site/index.html

          # Effort pages
          cp efforts/0001-menifee-food/site/index.html      _site/food/index.html
          cp efforts/0002-menifee-volunteers/site/index.html _site/volunteers/index.html
          cp efforts/0003-menifee-seniors/site/index.html   _site/seniors/index.html

          # Rewrite cross-links from file-system relative paths to GitHub Pages paths
          # Food page
          sed -i \
            -e 's|../../0003-menifee-seniors/site/index.html|../seniors/|g' \
            -e 's|../../0002-menifee-volunteers/site/index.html|../volunteers/|g' \
            _site/food/index.html

          # Volunteer page
          sed -i \
            -e 's|../../0001-menifee-food/site/index.html|../food/|g' \
            -e 's|../../0003-menifee-seniors/site/index.html|../seniors/|g' \
            _site/volunteers/index.html

          # Senior page
          sed -i \
            -e 's|../../0001-menifee-food/site/index.html|../food/|g' \
            -e 's|../../0002-menifee-volunteers/site/index.html|../volunteers/|g' \
            _site/seniors/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
