<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seedlings</title>
    <meta name="description" content="Grow everything from engineered life. A peaceful simulation game that plays in the browser." />
    <meta name="theme-color" content="#0b1424" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314b8a6'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23f1ebdc'/%3E%3C/svg%3E" />
    <style>
      /* Loading screen. Inline so it shows even before the game's own styles load. */
      html, body { margin: 0; height: 100%; background: #0b1424; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1424;
        color: #c9d4e2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 20;
        transition: opacity 0.5s ease;
      }
      #boot p { margin: 0; font-size: 15px; letter-spacing: 0.01em; }
      #boot.gone { opacity: 0; pointer-events: none; }
      .boot-seed {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #f1ebdc 0 32%, #14b8a6 33% 100%);
        box-shadow: 0 0 30px rgba(20, 184, 166, 0.55);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.8; }
        50% { transform: scale(1.06); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <div class="boot-seed" aria-hidden="true"></div>
      <p id="boot-text">Growing the first beetle…</p>
      <noscript><p>Seedlings needs JavaScript to run.</p></noscript>
    </div>
    <script>
      // If the game has not started after a while, say so plainly.
      setTimeout(function () {
        var t = document.getElementById('boot-text');
        if (t && document.getElementById('boot')) t.textContent = 'Seedlings is taking longer than usual to start. Try reloading the page.';
      }, 15000);
    </script>
    <canvas id="scene" aria-label="Seedlings 3D view"></canvas>
    <div id="fade" aria-hidden="true"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
